<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no"/> 
    <title>New Password</title>

    <!-- CSS File -->
    <link href="../../assets/css/auth-screens.css" rel="stylesheet">

    <!-- Bootstrap CSS -->
    <link href="../../assets/css/bootstrap.min.css" rel="stylesheet">

    <!-- JS -->
	<link href="../../assets/js/custom.js">
    <script src="../../assets/js/bootstrap.bundle.min.js"></script>

    <!-- Bootstrap Icons -->
    <!-- <link href="assets/css/bootstrap-icons.css" rel="stylesheet"> -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">

    <!-- Fonts -->
    <link href="https://fonts.cdnfonts.com/css/tt-firs-neue-trl" rel="stylesheet">
</head>


<body>
    <section class="new-password">
        <div class="container-fluid">
            <div class="row align-items-stretch">

                <div class="col-lg-6 img-side">
                    <div class="img-side-content">
                        <h2>New <br>Password</h2>
                    </div>
                    <img src="../../assets/img/new-password.png">
                </div>





                <div class="col-lg-6 form-out">
                    <div class="form-top col-lg-7"><img src="../../assets/img/logo.png">
                        <p>Please enter your new password.</p>

                    </div>


                    <form id="new-pas" class="col-lg-6 mt-2">


                        <div class="row g-3">

                            <div class="col-md-12 position-relative">
                                <label class="form-label">New Password</label>
                                <input type="password" class="form-control" id="password" placeholder="Enter Your Password">
                                <span class="password-toggle" onclick="togglePassword('password', 'eyeIcon1')">
                <i class="bi bi-eye-slash" id="eyeIcon1"></i>
            </span>
                            </div>
                            <div class="col-md-12 position-relative">
                                <label class="form-label">New Confirm Password</label>
                                <input type="password" class="form-control" id="confirm-password" placeholder="Enter Your Confirm Password">
                                <span class="password-toggle" onclick="togglePassword('confirm-password', 'eyeIcon2')">
                <i class="bi bi-eye-slash" id="eyeIcon2"></i>
            </span>
                            </div>

                        </div>




                        <div class="row">
                            <div class="col-md-12">
                                <button type="button" class="confirm-email btn btn-primary mt-4" data-bs-toggle="modal" data-bs-target="#passwordUpdatePopup">
                                    Update Password
                                </button>
                                <!-- Bootstrap Modal -->
                                <div class="modal fade" id="passwordUpdatePopup" tabindex="-1" aria-labelledby="emailVerificationPopupLabel" aria-hidden="true">
                                    <div class="modal-dialog modal-dialog-centered">
                                        <div class="modal-content">
                                            <div class="modal-header">
											<img src="../../assets/img/thumbs-up-img.png">
                                                <h5 class="modal-title" id="passwordUpdatePopup">Successful</h5>
                                                <!-- <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button> -->
                                            </div>
                                            <div class="modal-body text-center">
                                                <p>Successfully Updated New Password. Now you can sign in with your new password</p>

                                                <button class="btn btn-primary"><a href="#">Sign In Now</a></button>

                                            </div>
                                        </div>
                                    </div>
                                </div>								

                            </div>
                        </div>

                    </form>

                </div>


            </div>
        </div>
        </div>
    </section>
    <!-- Copyright text section -->
    <section class="copyright-text">
        <div class="container-fluid text-end">
            <p>© Copyright 2024, All Rights Reserved</p>
        </div>
    </section>


</body>


</html>

<script>
    function togglePassword(fieldId, iconId) {
        let passwordField = document.getElementById(fieldId);
        let eyeIcon = document.getElementById(iconId);

        if (passwordField.type === "password") {
            passwordField.type = "text";
            eyeIcon.classList.remove("bi-eye-slash");
            eyeIcon.classList.add("bi-eye");
        } else {
            passwordField.type = "password";
            eyeIcon.classList.remove("bi-eye");
            eyeIcon.classList.add("bi-eye-slash");
        }
    }
	</script>
