<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Forgot Password (Super Admin)</title>

    <!-- Main CSS File -->
    <link href="assets/css/main.css" rel="stylesheet">

    <!-- Bootstrap CSS -->
    <link href="assets/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap JS -->
    <script src="assets/js/bootstrap.bundle.min.js"></script>

    <!-- Bootstrap Icons -->
    <!-- <link href="assets/css/bootstrap-icons.css" rel="stylesheet"> -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">

    <!-- Fonts -->
    <link href="https://fonts.cdnfonts.com/css/tt-firs-neue-trl" rel="stylesheet">
</head>


<body>
    <section class="forgot-password">
        <div class="container-fluid">
            <div class="row align-items-stretch">

                <div class="col-lg-6 img-side">
                    <div class="img-side-content">
                        <h2>Forgot<br>Password</h2>
                    </div>
                    <img src="assets/img/forgot-pw-img.png">
                </div>





                <div class="col-lg-6 form-out">
                    <div class="form-top col-lg-7"><img src="assets/img/logo.png">
                        <p>How do i get started lorem ipsum dolar at?</p>

                    </div>


                    <form id="forgot-pas" class="col-lg-6 mt-2">


                        <div class="row g-3">
                            <div class="col-md-12">
                                <label class="form-label">Email</label>
                                <input type="email" class="form-control" placeholder="Enter Your Email">
                            </div>
                        </div>




                        <div class="row">
                            <div class="col-md-12">
                                <button type="button" class="confirm-email btn btn-primary mt-4" data-bs-toggle="modal" data-bs-target="#emailVerificationPopup">
                                    Confirm Email
                                </button>
                                <!-- Bootstrap Modal -->
                                <div class="modal fade" id="emailVerificationPopup" tabindex="-1" aria-labelledby="emailVerificationPopupLabel" aria-hidden="true">
                                    <div class="modal-dialog modal-dialog-centered">
                                        <div class="modal-content">
                                            <div class="modal-header">
                                                <h5 class="modal-title" id="emailVerificationPopup">Verify Email Address</h5>
                                                <!-- <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button> -->
                                            </div>
                                            <div class="modal-body text-center">
                                                <p>Verification code has been sent on <span>test@gmail.com</span></p>
                                                <div class="d-flex justify-content-center mt-4">
                                                    <input type="text" class="form-control text-center mx-1" style="width: 50px;" maxlength="1">
                                                    <input type="text" class="form-control text-center mx-1" style="width: 50px;" maxlength="1">
                                                    <input type="text" class="form-control text-center mx-1" style="width: 50px;" maxlength="1">
                                                    <input type="text" class="form-control text-center mx-1" style="width: 50px;" maxlength="1">
                                                </div>
                                                <button class="btn btn-primary">Confirm Code</button>
                                                <p class="mt-5 resend-code"><span>00:46</span><a href="#">Resend Confirmation Code</a></p>
                                            </div>
                                        </div>
                                    </div>
                                </div>


                            </div>
                        </div>

                        <p class="small_grey text-start form-text mt-3">
                            Remember Password? <a href="#" class="text-decoration-none"><b>Log In</b></a>
                        </p>
                    </form>

                </div>


            </div>
        </div>
        </div>
    </section>
    <!-- Copyright text section -->
    <section class="copyright-text">
        <div class="container-fluid text-end">
            <p>© Copyright 2024, All Rights Reserved</p>
        </div>
    </section>


</body>


</html>
